# Project profile
#
# A lookup table for the steps that need it — not a description of the project.
# Project descriptions and gotchas belong in CLAUDE.md, which is always in context.
# This file is read at specific moments: wrap-up needs the addresses, implement
# needs the exemplars, verify needs the commands.
#
# Leave a field empty rather than guessing. Empty means "not asked yet" and will be
# filled the first time something needs it. Wrong is silently wrong for months.
#
# Install location: .claude/composable-pipeline/project-profile.yml
#
# ---------------------------------------------------------------------------
# Two hard constraints on the content of this file. They hold whether or not it
# is committed, because that decision can change later and the file will not be
# re-audited when it does.
#
#   1. Nothing sensitive. No tokens, credentials, internal hostnames, or client
#      data. This file is read by agents, quoted into outputs, and may end up in
#      a repository someone else can read.
#
#   2. No absolute paths. Relative to the project root, or a named reference
#      (`project-office`, `creative-team:some/path`). An absolute path breaks on
#      any other machine and leaks the local filesystem layout into the project.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Where artifacts go.
#
# Value forms:
#   project-office        the task board, as the task itself
#   repo:docs/updates/    a path inside this repository
#   name:path             a path in another repository you work with
#   none                  this project does not keep this — stop asking
#
# Only the artifacts currently consumed are listed. More keys appear here when
# something first needs one: the agent asks once and writes the answer.
# ---------------------------------------------------------------------------
artifacts:
  progress_update: project-office   # `project-office task:checkpoint --task MTM-<n>`
  workflow_record: project-office    # `project-office task:comment-add --task MTM-<n>`
  client_update: none               # this project has no audience outside the team
  test_plan: project-office         # test matrix lives on the task, next to the spec
  list_flow: project-office         # the flow of a task list, as a comment on the list itself
  coverage_pass: project-office     # what the coverage lenses found absent
  options: project-office           # compared options and the recommendation
  architecture: project-office      # the chosen shape

# ---------------------------------------------------------------------------
# Language per surface.
#
# Default policy: anything public or code-adjacent is English; anything private
# or local is the user's own language. Override any line; a project can be
# entirely one language.
#
# `client` is independent of everything else — a board in one language and a
# client in another is normal.
# ---------------------------------------------------------------------------
language:
  chat: Ukrainian          # conversation with the user
  code: English            # identifiers and comments
  git: English             # commit messages, branch names, PR title and body
  repo_docs: English       # README, ADR, docs/ — anything committed goes to git in English
  office_docs: Ukrainian   # documents kept on the board, not in git
  tasks: Ukrainian         # task descriptions, specs and board comments; paths, identifiers and commands stay as-is
  client:                  # superseded by client_docs / client_messages; kept until removed by hand
  client_docs:             # not applicable: artifacts.client_update is none
  client_messages:         # not applicable: artifacts.client_update is none
  local_notes: Ukrainian   # anything not committed

# ---------------------------------------------------------------------------
# Exemplars — the highest-value section in this file.
#
# Each entry names a file that already does this kind of thing correctly.
# "Follow app/Services/Payroll/RecalculateTariff.php" carries more than a
# paragraph about layering, and a weaker model follows it far more reliably
# than it follows an abstract description.
#
# Use keys that match how this project is actually organized. What follows is
# an example of the shape, not a required set.
# ---------------------------------------------------------------------------
exemplars:
  # Backend — app/Domains/<Aggregate>/ holds the domain; app/Http splits WebApi (SPA) from CliApi (agents).
  action_handler: app/Domains/Task/Actions/CliAgentWorkflow/CheckpointTask/CheckpointTaskHandler.php
  domain_service: app/Domains/Task/Services/TaskKeyResolver.php
  model: app/Domains/Task/Models/TaskModel.php
  web_api_controller: app/Http/WebApi/Controllers/Tasks/TasksController.php
  cli_api_controller: app/Http/CliApi/Controllers/Tasks/TaskAgenticWorkflowController.php
  cli_form_request: app/Http/CliApi/Requests/Tasks/CheckpointTaskRequest.php
  web_api_update_request: app/Http/WebApi/Requests/TaskLists/UpdateTaskListRequest.php
  web_api_store_request: app/Http/WebApi/Requests/TaskLists/StoreTaskListRequest.php
  resource: app/Http/Shared/Resources/Tasks/TaskResource.php
  console_command:   # the markdown import was removed with document versioning; no exemplar left
  migration: database/migrations/2026_08_08_120000_add_status_description_and_key_to_task_lists_table.php
  test_unit: tests/Unit/Libs/EloquentFilters/FilterResolverTest.php
  test_feature: tests/Feature/CliApi/Tasks/TaskWorkflowCheckpointTest.php
  # Frontend — resources/js is FSD: app / pages / widgets / entities / shared.
  component: resources/js/widgets/tasks/create-dialog/ui/TaskCreateDialog.vue
  composable: resources/js/entities/task-view/composables/use.task-view-switcher.ts
  store: resources/js/app/stores/use.auth.store.ts
  api_client: resources/js/entities/task/api/task.api.ts
  e2e_spec: e2e/project-documents/autosave.spec.ts
  # Documents — read whole, matched for presentation rather than content.
  doc_task: project-office:MTM-197
  doc_task_list: project-office:MTM-TL-23
  doc_concept:        # this project agrees nothing with a client
  doc_status_update:  # status lives in checkpoints; no standalone exemplar
  # job: no ShouldQueue class exists yet — fill this in when the first one is written.

# ---------------------------------------------------------------------------
# Task labels — the layers a task name carries, as `N. [BE] …`.
# Empty: this project's task lists number tasks without labels (see MTM-TL-23).
# ---------------------------------------------------------------------------
task_labels:

# ---------------------------------------------------------------------------
# Verification — the exact commands, as this project runs them.
#
# tests_filtered matters most: a change is verified by the checks that cover it,
# not by running everything.
# ---------------------------------------------------------------------------
verification:
  # Run on the host, not in a container: docker compose here only provides Postgres, Redis and MinIO.
  # Backend tests need the task_manager_test database — see docs/testing.md.
  # vendor/ is built for PHP >= 8.4; the default `php` on this machine may resolve lower, so name the binary.
  tests: php8.5 artisan test && npm run test:unit
  tests_filtered: php8.5 artisan test --filter=<Name>   # or: php8.5 artisan test tests/Feature/<Path>Test.php; frontend: npx vitest run <path>
  lint: ./vendor/bin/pint --test && npm run lint:check
  types: php8.5 ./vendor/bin/phpstan analyse && npm run types:check
  build: npm run build
  # Filtered frontend checks: npx eslint <path>, npx vue-tsc -p tsconfig.app.json --noEmit
  # Filtered phpstan: php8.5 ./vendor/bin/phpstan analyse <path>
  # E2E (npm run test:e2e) reseeds the e2e database — run only when the user asks for it.
